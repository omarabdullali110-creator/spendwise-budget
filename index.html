<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="app-title">SpendWise</h1>
        <p id="budget-status" class="status-banner"></p>
    </header>

    <main class="container">
        <section class="summary-grid" aria-label="Budget Summary">
            <div class="summary-card">
                <span class="label">Monthly Budget</span>
                <strong id="monthly-budget">$200.00</strong>
            </div>
            <div class="summary-card">
                <span class="label">Total Spent</span>
                <strong id="total-spent">$0.00</strong>
            </div>
            <div class="summary-card">
                <span class="label">Remaining</span>
                <strong id="remaining-budget">$200.00</strong>
            </div>
        </section>

        <section class="form-section" aria-label="Add Expense">
            <h2>Add New Expense</h2>
            <form id="expense-form">
                <div class="form-row">
                    <label for="expense-name">Name</label>
                    <input type="text" id="expense-name" placeholder="e.g., Coffee" required>
                </div>

                <div class="form-row">
                    <label for="expense-amount">Amount ($)</label>
                    <input type="number" id="expense-amount" step="0.01" min="0.01" placeholder="e.g., 6.50" required>
                </div>

                <div class="form-row">
                    <label for="expense-category">Category</label>
                    <select id="expense-category">
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                    </select>
                </div>

                <div class="form-row">
                    <label for="expense-date">Date</label>
                    <input type="date" id="expense-date" value="2026-06-23" required>
                </div>

                <div class="form-actions">
                    <button type="submit" id="add-btn">Add Expense</button>
                    <button type="button" id="clear-btn" class="secondary-btn">Reset Sample Data</button>
                </div>
            </form>
            <p id="feedback-message" class="feedback" role="status"></p>
        </section>

        <section class="filter-section" aria-label="Filter Expenses">
            <label for="category-filter">Filter by Category:</label>
            <select id="category-filter">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Shopping">Shopping</option>
            </select>
        </section>

        <section class="table-section" aria-label="Expense Records">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="expense-table-body"></tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
